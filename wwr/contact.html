<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting for inquiries, reservations, and information about our exciting rafting adventures.">
    <meta name="author" content="Nelson Uhunoma">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>

            <div class="company-details">
                <p><strong>Moab, Utah 84532, USA</strong></p>
                <p><strong>Phone:</strong> +1 555 123 4567</p>
                <p><strong>Email:</strong> info@whitewaterrafting.com</p>
            </div>

            <div class="contact-layout">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d49911.06516976486!2d-109.5474905!3d38.56967805!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8747e1e59ab82d8d%3A0xb32b17af1d5c42d!2sMoab%2C%20UT%2084532%2C%20USA!5e0!3m2!1sen!2sng!4v1795428383982!5m2!1sen!2sng" width="400" height="300" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Map showing Moab, Utah">
                </iframe>

                <section class="contact-form">
                    <form action="#" method="post">
                        <label for="name">Your Name:</label>
                        <input type="text" id="name" name="name" required>

                        <label for="email">Your Email:</label>
                        <input type="email" id="email" name="email" required>

                        <fieldset>
                            <legend>Purpose of Message:</legend>

                            <label>
                                <input type="radio" id="general" name="purpose" value="general" required>
                                General Inquiry
                            </label>

                            <label>
                                <input type="radio" id="reservation" name="purpose" value="reservation">
                                Reservation Question
                            </label>

                            <label>
                                <input type="radio" id="suggestion" name="purpose" value="suggestion">
                                Website Suggestion
                            </label>
                        </fieldset>

                        <label for="message">Your Message:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>

                        <label>
                            <input type="checkbox" id="newsletter" name="newsletter">
                            Please subscribe me to the monthly newsletter
                        </label>

                        <button type="submit">Get in Touch!</button>
                    </form>
                </section>
            </div>
        </section>

        <section class="employee-profiles">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/james.jpg" alt="James Anderson, Head Rafting Guide">
                <figcaption>James Anderson - Head Rafting Guide</figcaption>
            </figure>

            <figure>
                <img src="images/sarah.jpg" alt="Sarah Mitchell, Safety Coordinator">
                <figcaption>Sarah Mitchell - Safety Coordinator</figcaption>
            </figure>

            <figure>
                <img src="images/daniel.jpg" alt="Daniel Brooks, Customer Service Manager">
                <figcaption>Daniel Brooks - Customer Service Manager</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 White Water Rafting | Nelson Uhunoma</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://www.linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn">
            </a>

            <a href="https://www.instagram.com">
                <img src="images/instagram.png" alt="Instagram">
            </a>
        </nav>
    </footer>


</body>

</html>
